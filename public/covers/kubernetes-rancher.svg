<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, monospace">
  <!-- kubernetes-rancher cover: ship captain (helmsman) steering a boat of containers -->
  <rect width="1600" height="900" fill="#ffffff"/>
  <ellipse cx="800" cy="730" rx="680" ry="140" fill="#e7f3f8"/>
  <circle cx="230" cy="170" r="80" fill="#ddedea"/>
  <circle cx="1420" cy="620" r="65" fill="#fbf3db"/>

  <!-- water -->
  <path d="M 120 760 Q 400 730 700 762 T 1300 758 T 1520 764" stroke="#2383e2" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 200 810 Q 480 780 780 812 T 1400 808" stroke="#2383e2" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- cargo boat -->
  <path d="M 620 640 L 1240 640 L 1170 740 L 690 740 Z" fill="#ffffff" stroke="#191919" stroke-width="9" stroke-linejoin="round"/>
  <!-- containers on the boat -->
  <rect x="700" y="560" width="120" height="72" rx="6" fill="#ddedea" stroke="#191919" stroke-width="7"/>
  <rect x="832" y="560" width="120" height="72" rx="6" fill="#88ccca" stroke="#191919" stroke-width="7"/>
  <rect x="964" y="560" width="120" height="72" rx="6" fill="#fbecdd" stroke="#191919" stroke-width="7"/>
  <rect x="766" y="478" width="120" height="72" rx="6" fill="#eae4f2" stroke="#191919" stroke-width="7"/>
  <rect x="898" y="478" width="120" height="72" rx="6" fill="#ddedea" stroke="#191919" stroke-width="7"/>
  <!-- container doors detail -->
  <path d="M 740 560 L 740 632 M 872 560 L 872 632 M 1004 560 L 1004 632 M 806 478 L 806 550 M 938 478 L 938 550" stroke="#191919" stroke-width="5"/>

  <!-- flag pole -->
  <path d="M 620 640 L 620 420" stroke="#191919" stroke-width="8" stroke-linecap="round"/>
  <path d="M 620 420 L 720 448 L 620 478 Z" fill="#88ccca" stroke="#191919" stroke-width="6" stroke-linejoin="round"/>

  <!-- captain stick figure at the wheel (right side, on deck) -->
  <circle cx="1120" cy="380" r="54" fill="#ffffff" stroke="#191919" stroke-width="9"/>
  <!-- captain hat -->
  <path d="M 1076 356 L 1164 356 L 1148 330 L 1092 330 Z" fill="#191919"/>
  <circle cx="1120" cy="368" r="6" fill="#191919"/>
  <circle cx="1146" cy="368" r="6" fill="#191919"/>
  <path d="M 1108 394 Q 1122 404 1138 394" stroke="#191919" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 1120 434 Q 1112 520 1116 610" stroke="#191919" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- arm to the wheel -->
  <path d="M 1118 468 Q 1160 470 1196 470" stroke="#191919" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 1116 450 Q 1150 430 1178 420" stroke="#191919" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 1116 610 L 1084 648 M 1116 610 L 1148 648" stroke="#191919" stroke-width="9" stroke-linecap="round"/>

  <!-- ship wheel -->
  <circle cx="1230" cy="470" r="46" fill="#ffffff" stroke="#191919" stroke-width="10"/>
  <circle cx="1230" cy="470" r="14" fill="#191919"/>
  <path d="M 1230 424 L 1230 516 M 1184 470 L 1276 470 M 1198 438 L 1262 502 M 1262 438 L 1198 502" stroke="#191919" stroke-width="8" stroke-linecap="round"/>

  <!-- speech bubble: desired state -->
  <rect x="960" y="200" width="420" height="86" rx="18" fill="#ffffff" stroke="#191919" stroke-width="7"/>
  <path d="M 1120 286 L 1100 330" stroke="#191919" stroke-width="7" stroke-linecap="round"/>
  <text x="990" y="252" font-size="26" fill="#37352f">must be 3 containers, always</text>

  <!-- self-healing: container being reborn -->
  <path d="M 1350 560 Q 1390 500 1440 540" stroke="#0f7b6c" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/>
  <rect x="1408" y="548" width="100" height="64" rx="6" fill="#ddedea" stroke="#0f7b6c" stroke-width="7" stroke-dasharray="12 8"/>
  <path d="M 1458 520 l 8 16 18 2 -13 13 3 18 -16 -9 -16 9 3 -18 -13 -13 18 -2 Z" fill="#88ccca" stroke="#191919" stroke-width="5" stroke-linejoin="round"/>

  <!-- checklist floating -->
  <rect x="180" y="380" width="300" height="250" rx="14" fill="#ffffff" stroke="#191919" stroke-width="9" transform="rotate(-4 330 505)"/>
  <path d="M 216 430 L 264 430 M 216 480 L 290 480 M 216 530 L 250 530 M 216 580 L 300 580" stroke="#787774" stroke-width="6" stroke-linecap="round" transform="rotate(-4 330 505)"/>
  <circle cx="228" cy="426" r="17" fill="#ddedea" stroke="#191919" stroke-width="5" transform="rotate(-4 330 505)"/>
  <path d="M 220 426 L 226 433 L 237 419" stroke="#0f7b6c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(-4 330 505)"/>
  <circle cx="228" cy="476" r="17" fill="#ddedea" stroke="#191919" stroke-width="5" transform="rotate(-4 330 505)"/>
  <path d="M 220 476 L 226 483 L 237 469" stroke="#0f7b6c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(-4 330 505)"/>
  <circle cx="228" cy="576" r="17" fill="#fbe4e4" stroke="#191919" stroke-width="5" transform="rotate(-4 330 505)"/>
  <path d="M 218 566 L 238 586 M 238 566 L 218 586" stroke="#e03e3e" stroke-width="6" stroke-linecap="round" transform="rotate(-4 330 505)"/>

  <!-- events vs logs labels on the left -->
  <text x="150" y="840" font-size="30" fill="#787774">not running? EVENTS · crashed after run? LOGS</text>
</svg>
